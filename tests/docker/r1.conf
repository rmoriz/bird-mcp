router id 10.255.0.1;
log stderr all;

protocol device {}

protocol static static4 {
  ipv4;
  route 192.0.2.0/24 blackhole;
  route 198.51.100.0/24 via 172.30.0.1;
  route 203.0.113.0/24 blackhole;
  route 192.0.2.0/24 via 172.30.0.1;
}

protocol bgp peer2 {
  local as 64512;
  neighbor 172.30.0.12 as 64513;
  ipv4 {
    import all;
    export all;
  };
}
