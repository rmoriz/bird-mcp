router id 10.255.0.3;
log stderr all;

# Routes added through the bird_routes_edit MCP tool.
include "/etc/bird/state/bird-mcp.conf";

protocol device {}

# Install BGP routes in the kernel so the router forwards traffic.
protocol kernel {
  ipv4 {
    import none;
    export where source = RTS_BGP;
  };
}

# This AS originates its customer prefix.
protocol static origin4 {
  ipv4;
  route 10.10.3.0/24 blackhole;
}

protocol bgp peer2 {
  local as 64514;
  neighbor 10.0.23.2 as 64513;
  ipv4 {
    import all;
    export where source = RTS_STATIC || source = RTS_BGP;
  };
}

protocol bgp peer4 {
  local as 64514;
  neighbor 10.0.34.3 as 64515;
  ipv4 {
    import all;
    export where source = RTS_STATIC || source = RTS_BGP;
  };
}
