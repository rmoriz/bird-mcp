# bird-mcp configuration for the five-router lab.
# Every router is reachable through a shared control socket volume; the agent
# container has birdc and writes the managed route files into /state.

docs_dir = "/opt/bird/doc"

[[routers]]
name = "r1"
transport = "local"
birdc = "birdc"
socket = "/run/bird/r1/bird.ctl"
config_file = "/configs/r1.conf"
routes_file = "/state/r1/bird-mcp.conf"
read_only = false

