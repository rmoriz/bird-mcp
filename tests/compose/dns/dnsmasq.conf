# Authoritative DNS and reverse DNS for the lab, forwarding everything else.
no-resolv
no-hosts
local=/lab/
domain=lab
bogus-priv
cache-size=1000
server=1.1.1.1
server=8.8.8.8

# Routers, hosts and the traffic generator. Multiple names on one record make
# the first name the PTR answer.
host-record=gw.as64512.lab,r1.lab,10.10.1.2
host-record=gw.as64513.lab,r2.lab,10.10.2.2
host-record=gw.as64514.lab,r3.lab,10.10.3.2
host-record=gw.as64515.lab,r4.lab,10.10.4.2
host-record=gw.as64516.lab,r5.lab,10.10.5.2

host-record=host.as64512.lab,h1.lab,10.10.1.3
host-record=host.as64513.lab,h2.lab,10.10.2.3
host-record=host.as64514.lab,h3.lab,10.10.3.3
host-record=host.as64515.lab,h4.lab,10.10.4.3
host-record=host.as64516.lab,h5.lab,10.10.5.3

host-record=sim.as64512.lab,sim.lab,10.10.1.4

# eBGP link endpoints.
host-record=r1-link12.lab,10.0.12.2
host-record=r2-link12.lab,10.0.12.3
host-record=r2-link23.lab,10.0.23.2
host-record=r3-link23.lab,10.0.23.3
host-record=r3-link34.lab,10.0.34.2
host-record=r4-link34.lab,10.0.34.3
host-record=r4-link45.lab,10.0.45.2
host-record=r5-link45.lab,10.0.45.3
host-record=r5-link51.lab,10.0.51.2
host-record=r1-link51.lab,10.0.51.3

# Docker bridge gateways (the .1 address of each lab subnet). These are the
# Docker VM, not BIRD routers, but naming them makes traceroute output clear.
host-record=docker-link12.lab,10.0.12.1
host-record=docker-link23.lab,10.0.23.1
host-record=docker-link34.lab,10.0.34.1
host-record=docker-link45.lab,10.0.45.1
host-record=docker-link51.lab,10.0.51.1
host-record=docker-as1.lab,10.10.1.1
host-record=docker-as2.lab,10.10.2.1
host-record=docker-as3.lab,10.10.3.1
host-record=docker-as4.lab,10.10.4.1
host-record=docker-as5.lab,10.10.5.1
host-record=docker-mgmt.lab,10.99.0.1

# Management plane (compose network 10.99.0.0/24).
host-record=dns.lab,10.99.0.53
host-record=whois.lab,10.99.0.54
host-record=opencode.lab,10.99.0.250
