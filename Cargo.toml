[package]
name = "bird-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol server for the BIRD Internet Routing Daemon"
license = "MIT"
readme = "README.md"

[[bin]]
name = "bird-mcp"
path = "src/main.rs"

[lib]
name = "bird_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
