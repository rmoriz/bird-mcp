name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on one runner per target, so no cross toolchain is needed.
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          name="bird-mcp-${version}-${{ matrix.target }}"
          mkdir -p "staging/${name}" dist
          cp "target/${{ matrix.target }}/release/bird-mcp" "staging/${name}/"
          cp README.md LICENSE CHANGELOG.md "staging/${name}/"
          tar -czf "dist/${name}.tar.gz" -C staging "${name}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              # A re-run for an existing tag: replace the assets.
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" dist/* \
                --title "$tag" \
                --generate-notes
            fi
            exit 0
          fi

          # Every push to main refreshes one rolling pre-release whose tag
          # follows the branch.
          tag="latest"
          short="$(git rev-parse --short "$GITHUB_SHA")"
          title="Latest build (${short})"
          notes="Rolling build of \`main\` at ${GITHUB_SHA}. Rebuilt on every push to main; this tag moves with it. For stable versions use a \`v*\` tag."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Replace the asset set: names carry the commit, so old files would
            # otherwise pile up in the rolling release.
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
              done
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
